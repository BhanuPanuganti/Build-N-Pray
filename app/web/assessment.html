<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BNB Live Assessment</title><style>body{margin:0;background:#0b1020;color:#eef3ff;font-family:system-ui}main{display:grid;grid-template-columns:2fr 1fr;gap:18px;padding:18px;max-width:1400px;margin:auto}section{background:#151d35;padding:18px;border-radius:12px}iframe{width:100%;height:390px;border:0;border-radius:8px}button{background:#6c7cff;color:#fff;border:0;border-radius:8px;padding:12px;margin:6px 0;font-weight:700}#question{font-size:1.25rem;line-height:1.5}#status{color:#aab8d8}pre{white-space:pre-wrap}</style></head>
<body><main><section><h1 id="title">Live assessment</h1><p id="status">Preparing secure section…</p><p id="question"></p><button id="repeat">Speak question</button><button id="record">Start recording</button><button id="stop" disabled>Stop and submit</button><pre id="feedback"></pre></section><section><h2>Live camera monitoring</h2><iframe id="proctor" allow="camera; microphone; fullscreen"></iframe></section></main><script type="module" src="/assessment.js"></script></body></html>
