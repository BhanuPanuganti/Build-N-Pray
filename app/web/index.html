<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BNB AI Interview Coach</title><link rel="stylesheet" href="/styles.css"></head>
<body><main><h1>BNB AI Interview Coach</h1><p id="status">Create a practice session.</p>
<section id="setup"><input id="name" placeholder="Candidate name" value="Demo Candidate"><input id="role" placeholder="Target role" value="Junior Software Engineer"><textarea id="jd" placeholder="Job description">Build web applications with JavaScript, APIs, data structures and teamwork.</textarea><textarea id="resume" placeholder="Résumé">Built a React task manager and studied data structures.</textarea><textarea id="goal" placeholder="Preparation goal">Practice technical and behavioural interview answers.</textarea><button onclick="startSession()">Start interview</button><button onclick="enableCamera()">Enable camera & microphone</button><video id="preview" muted autoplay playsinline></video></section>
<section id="interview" hidden><h2 id="question"></h2><button onclick="speakQuestion()">Repeat question</button><textarea id="answer" placeholder="Type your answer or dictate it."></textarea><button onclick="startDictation()">Dictate answer</button><button onclick="sendAnswer()">Submit answer</button><pre id="feedback"></pre><button onclick="startDSA()">Start timed DSA round</button></section>
<section id="dsa" hidden><h2 id="dsaTitle"></h2><p id="dsaPrompt"></p><strong id="timer"></strong><textarea id="code" placeholder="Write your solution here..."></textarea><button onclick="submitDSA()">Submit code</button></section>
<section id="report" hidden><h2>Final feedback</h2><pre id="reportContent"></pre></section></main><script src="/app.js"></script></body></html>
